<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>好友榜 · 设计预览台</title>
<style>
  body {
    margin: 0; padding: 24px;
    background: #EFECE4;
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2C2C2A;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: #6E685E; margin: 0 0 20px; font-size: 13px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: #6E685E; margin-top: 8px; text-align: center; }
  .case { background: #FDFBF6; border: 1px solid #E3E0D8; border-radius: 12px; padding: 10px; }
  canvas { display: block; border-radius: 8px; }
</style>
</head>
<body>
<h1>好友榜 · 设计预览台</h1>
<p class="hint">
  直接调用 <code>open-data/board.js</code> 的 <code>drawBoard()</code> 渲染 mock 数据 ——
  改设计时先在这里看效果，不用每次都上真机。<br>
  左边是「主域视角」（暗幕 + 卡 + 底部按钮，和 game.js 的 renderRank 同一套几何），右边是纯卡面。
</p>

<div class="row" id="row"></div>

<script src="../../who-is-circle/open-data/board.js?v=5"></script>
<script>
(function () {
  'use strict';

  var RANK_NAMES = ['灾难现场', '一团面条', '土豆', '饺子', '鸡蛋', '甜甜圈', '饼干',
    '轮胎', '满月', '圆规', '教科书', '精密仪器', '神之圆'];

  var PANEL = { w: 700, h: 1180 };

  function mkRows(n, opts) {
    opts = opts || {};
    var base = [
      { nickname: '苏晚晴', score: 98.6, level: 12, verdict: 'ok' },
      { nickname: '陈小舟', score: 97.4, level: 12, verdict: 'ok' },
      { nickname: '一个名字特别长的好友测试', score: 96.2, level: 11, verdict: 'unverified' },
      { nickname: '林一', score: 94.8, level: 11, verdict: 'ok' },
      { nickname: '周未眠', score: 93.1, level: 10, verdict: 'ok' },
      { nickname: 'A', score: 91.7, level: 9, verdict: 'ok' },
      { nickname: '赵青山', score: 88.3, level: 9, verdict: 'ok' },
      { nickname: '钱小满', score: 85.0, level: 8, verdict: 'ok' },
      { nickname: '孙大壮', score: 79.2, level: 7, verdict: 'ok' },
      { nickname: '李思', score: 74.5, level: 6, verdict: 'ok' },
      { nickname: '吴桐', score: 68.1, level: 6, verdict: 'ok' },
      { nickname: '郑一鸣', score: 61.3, level: 5, verdict: 'ok' }
    ];
    var rows = [];
    for (var i = 0; i < n && i < base.length; i++) {
      var b = base[i];
      rows.push({
        openid: 'o_' + i,
        nickname: b.nickname,
        avatarUrl: '',
        score: b.score,
        level: b.level,
        verdict: b.verdict,
        isSelf: false,
        rank: i + 1
      });
    }
    if (opts.self) {
      rows.push({
        openid: 'o_self', nickname: '我', avatarUrl: '',
        score: opts.self.score, level: opts.self.level,
        verdict: 'ok', isSelf: true, rank: rows.length + 1
      });
    }
    return rows;
  }

  function drawCard(canvas, rows, extra) {
    var dpr = 2;
    var opts = {
      width: PANEL.w,
      height: PANEL.h,
      style: {},
      rankNames: RANK_NAMES,
      selfScore: (extra && extra.selfScore) || null,
      emptyText: (extra && extra.emptyText) || '还没有好友在玩'
    };
    // 画布尺寸先按 board 给的高度定好（改尺寸会清空画布）
    var H = Board.boardHeight(rows, opts);
    canvas.width = PANEL.w * dpr;
    canvas.height = H * dpr;
    canvas.style.width = (PANEL.w / 2) + 'px';
    canvas.style.height = (H / 2) + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Board.drawBoard(ctx, rows, opts);
  }

  // 主域视角：暗幕 + 卡 + 底部返回按钮（与 game.js renderRank 同一套几何）
  function drawPage(canvas, rows, extra) {
    var dpr = 2;
    var W = 750, H = 1624;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = (W / 2) + 'px';
    canvas.style.height = (H / 2) + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 遮罩（game.js renderRank 的同一套：上深下浅的渐变）
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(38,36,32,0.78)');
    grad.addColorStop(1, 'rgba(38,36,32,0.52)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 卡（开放数据域画的内容）
    // 贴法与 game.js 的 drawSharedCanvas 一致：按宽高比等比居中
    var card = document.createElement('canvas');
    drawCard(card, rows, extra);
    var ar = card.width / card.height;
    var cw = PANEL.w, ch = PANEL.w / ar;
    if (ch > PANEL.h) { ch = PANEL.h; cw = PANEL.h * ar; }
    ctx.drawImage(card, 25 + (PANEL.w - cw) / 2, 210 + (PANEL.h - ch) / 2, cw, ch);

    // 底部返回按钮（secondary 样式）
    var bw = 340, bh = 96, bx = 375, by = 1500;
    ctx.fillStyle = '#F1EDE4';
    ctx.beginPath();
    var r = bh / 2;
    ctx.moveTo(bx - bw / 2 + r, by - bh / 2);
    ctx.arcTo(bx + bw / 2, by - bh / 2, bx + bw / 2, by + bh / 2, r);
    ctx.arcTo(bx + bw / 2, by + bh / 2, bx - bw / 2, by + bh / 2, r);
    ctx.arcTo(bx - bw / 2, by + bh / 2, bx - bw / 2, by - bh / 2, r);
    ctx.arcTo(bx - bw / 2, by - bh / 2, bx + bw / 2, by - bh / 2, r);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#D8D2C4';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#2C2C2A';
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('返回', bx, by + 2);
  }

  var CASES = [
    { title: '满榜 + 我在第 9 名', rows: mkRows(9, { self: { score: 79.2, level: 8 } }) },
    { title: '3 人（短榜）', rows: mkRows(3, { self: { score: 94.8, level: 11 } }) },
    { title: '只有 1 人', rows: mkRows(1) },
    { title: '空榜', rows: [], extra: { emptyText: '还没有好友在玩' } },
    { title: '我未上榜（只有本地分）', rows: mkRows(4), extra: { selfScore: 77.7 } }
  ];

  var row = document.getElementById('row');
  CASES.forEach(function (c) {
    var fig = document.createElement('figure');
    var wrap = document.createElement('div');
    wrap.className = 'case';
    wrap.style.display = 'flex';
    wrap.style.gap = '10px';

    var page = document.createElement('canvas');
    var card = document.createElement('canvas');
    wrap.appendChild(page);
    wrap.appendChild(card);
    fig.appendChild(wrap);

    var cap = document.createElement('figcaption');
    cap.textContent = c.title;
    fig.appendChild(cap);
    row.appendChild(fig);

    drawPage(page, c.rows, c.extra);
    drawCard(card, c.rows, c.extra);
  });
})();
</script>
</body>
</html>
